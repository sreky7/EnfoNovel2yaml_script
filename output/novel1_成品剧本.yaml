drama_info:
  book_name: novel1
  source: 本地txt小说素材
  total_scene: 1
  original_word_count: 5229
  create_time: '2026-06-07 00:46:05'
role_list:
- role_id: 1
  role_name: 主角
  role_desc: 学生，步行上学途中偶遇古董店。
- role_id: 2
  role_name: 袭老板
  role_desc: 古董店老板，一身白衣戏妆，神秘莫测。
scenes:
- scene_id: 1
  scene_title: 开篇序章
  location: 十霂街古董店
  scene_synopsis: 主角清晨路过十霂街，被一家神秘古董店吸引，推门而入遇见白衣戏妆老板。
  contents:
  - type: narrate
    content: 缓步在石子铺成道路上走着。难得是个晴天，远处的粉中透红，紫里泛白的朝霞与另一边灰白黑，还未被映红的乌云形成一道独特而别有一番风味的奇景。久违的改骑车而步行上学，其实步行也不算远，只是路上会经过一条名为十霂的古街。那条街历史久远，只是现如今变成了一条空街，虽说有相应的门面店铺会借此街的名声做小本买卖，但是上学的时间毕竟过早，每当我从空无一人的街道上走过时，总感觉身后会吹过丝丝凉风，因此，也不免对步行渐渐疏远了起来。今天的十霂街倒是“风平浪静”，只有微风拂过脸颊，吹起古铃阵阵，乐音声声。不经意的往右撇了一眼，一家与众不同的店瞬间将我的目光牢牢锁住，再动弹不得。这家店与其他古色古香的店铺看似是一脉相承，实则细看却别有洞天。店的门面由紫檀木制成，在晨光的反照下，泛着神秘的幽光。没有牌匾，在其位子上的是一条飞龙，那龙有神却无珠。巨大的龙身盘旋在古董店的上方，精细的雕刻着密密麻麻的古文和图腾。整家店都显现出一种神秘而诡异的氛围。瞧了一眼腕表，6：45分。步子不由自主的迈向老店，待走的近了，才看见古门上雕刻着一张巨大的脸谱，只是其色与古门极为相近，只是依稀根据上面深浅不一的纹路才能勉强分辨。
  - type: narrate
    content: “跟戏剧有关的古董店？”我心里暗忱着，不过这装璜也太奢侈了吧。“就看一眼，看一眼就走。”手握在古门上的两个门环上，一阵冰凉。轻扣三下无人应答，虽知这样并不礼貌，但还是忍不住好奇心的诱惑，缓缓推开推开，入眼的是一道巨大的屏风。屏风是素白的，但是屏风之上密密麻麻挂着的是，脸谱？有白脸的，黄脸的，黑脸的，有丑，旦，生，净……正当我看着眼前的脸谱出神时，从屏风之后走出了一个高挑的身影。从头到脚一身白，与漆黑的店铺形成鲜明的对比，再定睛一看，是古代的服饰，但具体是哪个朝代的，却不甚清楚。情理之中，意料之外的，此人身上画着妆，是戏妆。一身白衣，一脸浓妆，一把折扇，看不清其真面目，但可以肯定的是，长相绝对不差。嘿嘿，好吧作为颜控的我肤浅了。
  - type: dialogue
    role_id: 2
    content: 你……是怎么进来的？
  - type: narrate
    content: 他看起来似乎格外的惊讶，不敢置信的盯着我看。我让他给问蒙了，开店不就是要做生意，居然，不让人进？迅速回想了一下店门口有没有挂请勿靠近的牌子。没有啊？
  - type: dialogue
    role_id: 1
    content: 就——推门进来的啊。
  - type: narrate
    content: 一阵无言。为了避免尴尬的气氛持续出现，我连忙转移了视线。视线所及之处，古色古香，各种奇珍异宝，虽说我见识短浅，但还是能看出其中的不凡之处。视线迅速浏览了一遍，较为奇怪的是在琳琅满目的木架上，居然没有一张脸谱，我还以为这家店专卖脸谱。
  - type: dialogue
    role_id: 2
    content: 鄙人姓袭，这位爷来这小店，所谓何事？
  - type: narrate
    content: 声音低沉温润，令人过耳不忘。爷？这是啥时候的称谓？我迅速的思考了一下，觉得不太思议，先不说其服饰奇怪和一点也不像店老板的语气，这生活中的习惯再一次让我感受到了这家店的不一般。
  - type: dialogue
    role_id: 1
    content: 我……就随便看看。
  - type: narrate
    content: 心中疑惑，但我忽然发现这家店里不知道为什么忽然多出来了许多白烟，或多或少的从四面八方朝我扑涌而来。
  - type: dialogue
    role_id: 2
    content: 那么，请随意挑选一件作为刚才的袭某失态的赔礼。
  - type: narrate
    content: 袭老板低沉的声音中有一丝不一觉察的讥讽，微动扇子，身影逐渐与白烟融为一体。在意识到事情不对之前，我凭着潜意
  - type: action
    role_id: 1
    content: 识在货廊上随手抓了一个东西。
  - type: narrate
    content: 紧接着，白烟越来越多，逐渐的，我几乎都已经看不到我的脚了。
  - type: narrate
    content: 可能唯一能庆幸的也就只有脚还踩在地上，尝试着往前走几步，面前只有几尺的架子居然不见了，与之同时消失的是我身上的衣服，书包，可以毫不夸张的说，现在，我不着寸缕，唯一在身上的只有那个随手抓的物品。
  - type: action
    role_id: 1
    content: 我定睛一看，那是一个小巧的香囊，仔细观察了一下，香囊呈六边形，边角分明，最外的一圈被金丝线细细的缝了一圈，每个角上都挂着一只小小的凤凰，精美至极，由外到内，分别用颜色不一的丝线绣出了一只五彩鸾凤，其神态非凡。
  - type: narrate
    content: 脚丫直接踩在了地上，感觉很泥泞，白烟逐渐散去，我环顾四周，眼珠子没掉下来。
  - type: narrate
    content: 眼前是……猪？
  - type: narrate
    content: 和猪只有一圈木栏之隔的我直接傻了，簌溜溜的凉风吹过，不禁打了个哆嗦。就地找了干净的稻草坐下，款款用剩余的稻草围在身前，才觉得心累。
  - type: narrate
    content: 我在一个看起来很高的亭楼后院的牲口圈里，此时以是将近夕阳落日之时，这亭楼高耸入云，至下而上，由圆及方，从最低部的一层及上，层层之间都有桩梁柱支撑，其上刻得有祥云七仙，麒麟鸾凤，起起伏伏的石雕配合着缓缓过度的朱赤，整个玉柱在阳光的映射下泛出参差不一的微光，一层的顶紧接二层的底，屋檐向四周延展而去，在天空为幕布的背景之下，四只凤鸾翘首而立，两翼张开，身后五彩皆散开来，越高处有薄雾彩云，将亭楼的身影笼罩起来，若隐若现，好在在圈子外围，与后院只有一栏杆之隔，与外界只有……一堵高墙之隔。
  - type: narrate
    content: 就连地面也有所不同，我所在的牲口圈是细细的青草铺成的泥土地。而圈子外直至包括着亭楼的所有地域，都用紫禅木裁断成花纹不一的小块，依次工整有致的拼接起来，错综复杂的线条蜿蜒在细腻的木板上，令人再一次认识到这亭子的不凡与奢华。
  - type: narrate
    content: 正当我在想是光膀子跑出去呢，还是等贵人相助时，一阵锁链的喀啦声让我一下惊醒，俯身向外看去，高楼的一角处一闪一闪的走出两抹身影，一高一矮，高的那位体型修长，脸上抹着唱戏用的浓妆，身材……比我一女子，好太多。矮的那位脚上和手上都有铁链，就看那小身板才四五岁的样子，走的格外吃力，两位走的很慢，许是小孩的缘故，我眼巴巴的看着他们身上的衣服，这应该是古代明朝的衣服，至于我为啥能认出来，只能说最近老陈逼着我把历史背了背。
  - type: narrate
    content: 只见那高挑的男人带着小男孩就来到了塔楼的后墙，这时我才看到高亭的后墙上有几个挂剩下的铁钩子。
  - type: narrate
    content: 不会吧……
  - type: narrate
    content: 正当我想着那铁钩子的用处时，那小男孩自觉的把手抬高，男人自然而然的把铁链挂在了铁钩上，紧接着，我看到了惊奇的一幕：那小男孩的两手被铁链拴着高高的禁锢在两旁，而下半身横劈着坐在墙角，男人又在一旁拿了两个古色古香的木凳，将男孩的脚放在其上，只见那男孩逐渐额上出了丝丝细汗，脸也渐渐蔓上了两朵红晕，男人见状，轻笑了一声，声音低沉，略带一丝慵懒。从腰间抽出了一条黑绫，覆在了男孩的双眸上，随后转身而去，逐渐消失在红楼的墙角。
  - type: narrate
    content: 我都看傻了，哪里还记得自己的窘迫处境，待到男人的影子彻底消失不见时，我才想起来自己还光着膀子，在吹动的微风中，我欲哭无泪。
  - type: narrate
    content: 干坐着大概有半个小时，意外发生了。
  - type: narrate
    content: 之前男孩一只低垂着头，丝丝缕缕的细发自两鬓垂下，软软的，在米黄色的阳光下泛出金黄的光晕。如果忽略其手上的镣铐和身底的瓦块，还真是一幅惬意的午后正太图。
  - type: narrate
    content: 而突如其来的意外打破了一直以来的宁静。我的眼前忽的自上而下闪过了一小抹火红的身影，落在了偌大的后院里。
  - type: action
    role_id: 1
    content: 待我定睛一看，那分明是个七八岁的女孩，只见她头戴赤色琉璃小珠钗，身穿赤色复层花纹轻纱，脚腕和手腕上分别带着两小链，一钟是象征身份的家族链，丝丝粒粒穿起的是一只展翅的凤凰，另一种象征着年龄，具体未看太清，不过应该和我估计的相差不了多少。
  - type: narrate
    content: 只见那小女孩落地之后，对四周的一切都充满了好奇，很快，她的目光就落在了小男孩的身上。
  - type: narrate
    content: 只见小女孩径直走了过去，古色古香的金缕刺绣鞋在典雅的木块上踩出一阵轻快的步伐声。
  - type: narrate
    content: 她走到男孩的前面微微俯身。那小女孩是樱桃般的玉唇，粉琢搬的小脸，两抹淡淡的红晕如祥云一般晕散开在脸颊之上。而小男孩也丝毫不逊色。
  - type: narrate
    content: 只见女孩伸出纤纤玉手，轻轻放于黑绫垂落之处，抽出，刹那间，黑绫滑落，露出一双迷茫无助的眼眸。
  - type: narrate
    content: 两人一高一低，四目相望，温暖的夕阳透过二人，形成错落有致的阴影。
  - type: narrate
    content: 只有两人的眼眸熠熠生辉，仿佛包容了星辰大海。此乃，是初见。凤冠霞帔，暮走晓来，殊途只恨才相逢。
  - type: narrate
    content: 未等我叫住那小女孩，脑中一阵眩晕，整个人就要跌倒过去，眼帘合上的最后一刻，我仿佛看到那女孩伸出手，往前抛出一物。
  - type: narrate
    content: 再次醒来之后，赫然发现自己又坐在了店里的木板之上。手中依旧紧握着那香囊。
  - type: narrate
    content: 咦？怎的这木板快如此眼熟？竟正是前几分钟那高楼及周围所铺设的木板快。一模一样，无论是色泽，亦或是镂空的花纹。
  - type: dialogue
    role_id: 2
    content: 抱歉让姑娘受惊。您的衣服在木椅上。
  - type: narrate
    content: 正觉得袭老板的声音有些耳熟时，衣服两字如洪钟在脑中敲响，脸红的彻底，慌忙抓起一旁的衣服套上。
  - type: narrate
    content: 我的脚……正欲穿鞋的时候才发现脚上遗留的泥巴早已蹭了一地。
  - type: narrate
    content: 这下人丢大发了……
  - type: narrate
    content: 心想着，袭老板不知何时站在屏风一侧，无言的盯着泥痕纵横的地板。我是站着也不是，坐下更不是。
  - type: action
    role_id: 2
    content: 袭老板的嘴角微不可见的抽搐了一下，随后面色如常的走过中庭去了后堂，回来时手中多了一块古色古香的抹布，潇洒的丢在我眼前。
  - type: dialogue
    role_id: 2
    content: 擦干净——
  - type: action
    role_id: 1
    content: 话音未落，我拿起就开干，总算收拾入常后，抬起腕表一看，6:55。
  - type: narrate
    content: 我天！离早自习只有五分钟……
  - type: action
    role_id: 1
    content: 推门的一刻，而后清楚听到袭老板讥笑的声音
  - type: dialogue
    role_id: 2
    content: 有缘再会——
  - type: action
    role_id: 1
    content: 顾不得多想，一边将香囊揣进书包口袋，一遍朝街外狂奔着，幸而出了街左转不远就是学校，三步并作两步，终于踏着铃声赶到了。
  - type: narrate
    content: 在周围人用差异的眼光看着我时，我忽然发现书包在发光，莹润的光从书包口中发出，给人宁静祥和之感。但一来不及拿出查看，只好作罢。
  - type: narrate
    content: 课闭，大步奔向十霂街，走在街口便迫不及待的拿出香囊，只见六角之中有三只鸾凤正微微发光，待我转了方向，只见那亮着的鸾凤赫然又变成了另三只。方向？罗盘？脑中闪过无数念头，朝那店的方向走去，站至店门，却发现原本有巨龙盘绕的店门赫然变成了一扇普普通通的古木门。怪了，这店的位置改变了，拿起香囊，又往前走了数步才看到那大气的木门。
  - type: action
    role_id: 1
    content: 将手再次置于门环上，又轻扣了三声，依旧无人应答。只好再次推门，脸谱们静静地躺在素白的屏风之上，漫步走过屏风，见袭老板悠然的躺在一把古香古色的长椅上，脸上依旧是一派唱戏的妆容，狭长的丹凤眼微微眯着，手中的扇子微微摇着，在他身旁，有一把同样的椅子，上面端端正正的摆放着一套古时女子所穿的衣服，位于衣服之上的是一双绣着绯色花瓣的花鞋。
  - type: narrate
    content: 正当我进也不是，退也不是，左右为难的时候，袭老板总算是发话了
  - type: dialogue
    role_id: 2
    content: 穿上，慢走不送。
  - type: dialogue
    role_id: 1
    content: 啊……在哪换？
  - type: action
    role_id: 2
    content: 袭老板微睁眼眸
  - type: dialogue
    role_id: 2
    content: 睁眼，后转。
  - type: dialogue
    role_id: 1
    content: 屏风后面？万一门开了——
  - type: dialogue
    role_id: 2
    content: 不会开。
  - type: action
    role_id: 1
    content: 我将信将疑的走到门前，伸手推门，情理之中，意料之外的发现，门果然开不了了，转头看着满面墙的面具，总觉得哪里怪怪的。
  - type: narrate
    content: 很快，我悲催的发现，这古代的衣服，是根本不会穿啊。但白烟并不这么想，很快地从四面八方喷涌而出，就在我刚刚将衣服胡乱裹在身上，穿进鞋中时，早已置身于店外不只是何时何地了。这次许是穿上鞋的缘故，并没有感觉到泥泞。
  - type: action
    role_id: 1
    content: 一边努力的将一片衣角塞进腰间，一边抬头望向白烟散尽的地方。面前是一座大戏台，但并不是之前记忆里的那座古阁，而在一座极为奢华的建筑里。大致扫过，应是有两层，第一层与戏台相连，只不过第二层建成半悬在一层大堂的样子，二层的隔间不多，只有六个，我所在的恰好是与戏台正对着的一厢，偌大的戏台子，正拉着帘幕，里面传来人们有条不紊的安排声音。
  - type: narrate
    content: 这个放到这——
  - type: narrate
    content: 那边那个，过来搬，快点！
  - type: narrate
    content: 我晃了晃神，又看向厢间下的一楼，里面熙熙攘攘，大多都是穿着锦袍的公子，仆众成群，好不气派。
  - type: narrate
    content: 下面的人看起来都这般如此，那这上面几个包厢……正当我想着究竟是何等人才能在这里赏戏时，从身后左侧的通道处传来了一阵脚步声，步子不急不缓，踏在我杂乱的心尖。
  - type: narrate
    content: 哪里……哪里可以躲？
  - type: action
    role_id: 1
    content: 慌忙望着四周，眼瞅到一面古色古香的屏风在厢间的左后侧，马上闪身藏在其后。右脚刚刚收进屏风，厢们就被打开了。
  - type: narrate
    content: 嗒，嗒，嗒……脚步徐徐来到厢内的软榻前，停下的同
  - type: narrate
    content: 时，一声清冽而明丽的女声响在厢间内——
  - type: narrate
    content: 柒韻，请袭掌事来一趟。
